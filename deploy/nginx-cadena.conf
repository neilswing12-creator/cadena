# nginx site for PisoScan. Copy to /etc/nginx/sites-available/cadena.pilipiknow.online,
# symlink into sites-enabled, then: nginx -t && systemctl reload nginx && certbot --nginx -d cadena.pilipiknow.online --redirect
limit_req_zone $binary_remote_addr zone=cd_req:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=cd_api:10m rate=8r/s;
limit_conn_zone $binary_remote_addr zone=cd_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name cadena.pilipiknow.online;

    client_max_body_size 1m;
    limit_conn cd_conn 40;

    # never serve dotfiles, databases or keys
    location ~ /\.(?!well-known) { return 404; }
    location ~* \.(db|sqlite|pem|env|log|bak)$ { return 404; }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3470;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        limit_req zone=cd_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:3470;
        include /etc/nginx/snippets/cadena-proxy.conf;
    }

    location / {
        limit_req zone=cd_req burst=60 nodelay;
        proxy_pass http://127.0.0.1:3470;
        include /etc/nginx/snippets/cadena-proxy.conf;
    }
}
